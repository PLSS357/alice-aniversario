/* Animações de navegação e reações: entram suavemente sem comprometer controles. */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes aura{0%,100%{opacity:.28;transform:scale(.92)}50%{opacity:.65;transform:scale(1.12)}}
@keyframes popIn{0%{opacity:0;transform:scale(.88)}75%{opacity:1;transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes ping{0%{box-shadow:0 0 0 0 #f37b6955}65%{box-shadow:0 0 0 12px #f37b6900}100%{box-shadow:0 0 0 0 #f37b6900}}
@keyframes spark{from{opacity:1;transform:translateY(0) scale(.75)}to{opacity:0;transform:translateY(-31px) scale(1.65)}}
@keyframes wireDraw{from{stroke-dashoffset:850;opacity:.15}to{stroke-dashoffset:0;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes lightOn{0%{filter:brightness(.7)}50%{filter:brightness(1.6)}100%{filter:brightness(1)}}
@keyframes celebration{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 20px #f37b695e)}}
.hero>div:first-child{animation:pageIn .65s cubic-bezier(.2,.7,.2,1) both}

.hero-visual .orbit-circle{animation:breathe 6s ease-in-out infinite}

.section-top{animation:pageIn .55s .05s both}
.game-card{animation:pageIn .58s both}
.game-card:nth-child(2){animation-delay:.08s}
.game-card:nth-child(3){animation-delay:.16s}

.wrong-connection{animation:shake .26s}
.lamp-ray{transition:transform .32s ease,opacity .25s;animation:lightOn 2.4s ease-in-out infinite}

.book-selected{box-shadow:0 6px 20px #a0d6bc33}

/* Arte de cenário: imagens originais + hotspots HTML acessíveis. */

.maze-canvas{position:relative;box-shadow:0 0 35px #05050a48}
.result{animation:pageIn .5s cubic-bezier(.17,.75,.23,1) both}
@keyframes objectPulse{0%,100%{box-shadow:0 0 0 3px #11111180,0 0 10px #f37b693b}50%{box-shadow:0 0 0 5px #11111150,0 0 19px #f37b697e}}
@keyframes roomLight{0%,100%{opacity:.82}50%{opacity:1}}
@keyframes roomEnter{from{opacity:.4;transform:scale(1.045)}to{opacity:1;transform:scale(1)}}
@media(max-width:680px){.esc-scene{aspect-ratio:1000/660}.esc-scene .hotspot{width:29px;height:29px;font-size:15px}.cover-illustration{object-position:center}}
@media(prefers-reduced-motion:reduce){.room-photo,.room-glow,.esc-scene .hotspot,.cover-illustration{animation:none!important;transition:none!important}}

  <title>Aniversário da Alice</title>
</head>
<body>
  <div id="app"></div>
  <script>
/* Aniversário da Alice — 3 minigames sem bibliotecas e sem servidor. */
(() => {
  'use strict';
  const KEY = 'alice-aniversario-14-progress-v1';
  const app = document.getElementById('app');
  const games = ['rhythm', 'maze', 'escape'];
  const meta = {
    rhythm: {title:'Ritmo',time:'~1 minuto',description:'Acompanhe as notas da música e acerte no tempo certo.'},
    maze: {title:'Labirinto',time:'~2–4 minutos',description:'Encontre a saída. A direção contrária também é uma direção, tecnicamente.'},
    escape: {title:'Escape Room',time:'~7–10 minutos',description:'Investigue o quarto e resolva quatro enigmas diferentes para sair.'}
  };
  let completed = loadProgress();
  let currentView = 'home';
  let cleanup = () => {};
  let activeDialog = null;

  function loadProgress() {
    try { const x = JSON.parse(localStorage.getItem(KEY) || '{}'); return Object.fromEntries(games.map(g => [g, !!x[g]])); }
    catch { return {rhythm:false,maze:false,escape:false}; }
  }
  function saveProgress() { try {localStorage.setItem(KEY,JSON.stringify(completed));} catch {} }
  function markComplete(g) {completed[g]=true;saveProgress();updateProgress();}
  function count() {return games.filter(g=>completed[g]).length;}
  function allDone() {return count()===3;}
  function updateProgress() {
    const counter=document.querySelector('#progress-number');
    if(counter)counter.textContent=`${count()}/3 jogos`;
  }
  function shell(content) {
    app.innerHTML=`<header class="site-header"><div class="container nav-inner"><button class="logo" id="logo" aria-label="Voltar para a página inicial">alice<span>.</span></button><div class="nav-right"><span class="progress-pill" aria-label="Progresso"><span class="dot"></span><span id="progress-number">${count()}/3 jogos</span></span><button class="subtle-btn" id="top-home">Início</button></div></div></header><main class="container main" id="main">${content}</main>`;
    document.querySelector('#logo').addEventListener('click',()=>go('home'));
    document.querySelector('#top-home').addEventListener('click',()=>go('home'));
  }
  function go(view) {
    cleanup();cleanup=()=>{};closeDialog();currentView=view;
    window.scrollTo({top:0,behavior:'instant'});
    if(view==='home') renderHome();
    else if(view==='rhythm') renderRhythm();
    else if(view==='maze') renderMaze();
    else if(view==='escape') renderEscape();
    else if(view==='final') renderFinal();
  }
  function gameFrame(g, content) {
    const m=meta[g];
    shell(`<section class="game-view"><button class="back-link" id="back-home">← Voltar aos jogos</button><div class="game-head"><div><span class="eyebrow">Minigame ${games.indexOf(g)+1} de 3</span><h1 class="page-title">${m.title}</h1><p class="game-intro">${m.description}</p></div></div><div class="game-board">${content}</div></section>`);
    document.querySelector('#back-home').addEventListener('click',()=>go('home'));
  }
  function completionBlock(title,message,retry,extra='') {
    return `<div class="result" role="status"><span class="eyebrow">Concluído</span><h3>${title}</h3><p>${message}</p>${extra}<div class="result-actions"><button class="btn btn-primary" id="result-next">${allDone()?'Ver minha mensagem':'Voltar aos jogos'} →</button><button class="btn btn-secondary" id="result-retry">Jogar de novo</button></div></div>`;
  }
  function attachCompletion(next, retry) {
    document.querySelector('#result-next')?.addEventListener('click',()=>go(allDone()?'final':'home'));
    document.querySelector('#result-retry')?.addEventListener('click',()=>go(retry));
  }

  function renderHome() {
    const mazeCells=['w','w','w','w','w','w','w','w','p','p','p','w','p','w','w','p','w','p','w','p','w','w','p','w','p','p','p','w','w','p','w','w','w','p','w','w','p','p','p','w','p','w','w','w','w','p','p','p','w'];
    const arts={
      rhythm:`<img class="cover-illustration" src="assets/cover_rhythm.webp" alt="" loading="lazy">`,
      maze:`<img class="cover-illustration" src="assets/cover_maze.webp" alt="" loading="lazy">`,
      escape:`<img class="cover-illustration" src="assets/cover_escape.webp" alt="" loading="lazy">`
    };
    const cards=games.map((g,i)=>{
      const m=meta[g];
      return `<article class="game-card"><div class="card-art ${g==='rhythm'?'ry':g==='maze'?'ma':'es'}">${arts[g]}</div><div class="card-body"><div class="card-meta"><span>0${i+1} / ${m.time}</span>${completed[g]?'<span class="completed">✓ Concluído</span>':'<span>Disponível</span>'}</div><h3>${m.title}</h3><p>${m.description}</p><button class="btn ${completed[g]?'btn-secondary':'btn-primary'} btn-small card-play" data-game="${g}">${completed[g]?'Jogar novamente':'Jogar'} <span aria-hidden="true">↗</span></button></div></article>`;
    }).join('');
    shell(`<section class="hero"><div><span class="eyebrow">Para Alice, nos seus 14 anos</span><h1>Feliz aniversário, <em>Alice.</em></h1><p class="hero-description">Fiz três joguinhos pra você. Termina os três que tem uma mensagem no final.<br><strong>E tenta não passar vergonha, pirralha.</strong></p><div class="hero-actions"><button class="btn btn-primary" id="hero-start">${allDone()?'Ler a mensagem':'Começar a jogar'} <span aria-hidden="true">→</span></button></div></div><div class="hero-visual" aria-hidden="true"><div class="orbit-circle"></div><div class="big-age">14</div></div></section><section id="games"><div class="section-top"><div><span class="eyebrow">Três jogos</span><h2>Escolhe por onde começar.</h2></div><p>Jogue na ordem que quiser. Seu progresso fica salvo neste aparelho.</p></div><div class="game-grid">${cards}</div></section>${allDone()?`<section class="border-top" style="margin-top:32px"><h2 class="section-heading">Você terminou os três.</h2><p class="muted">Tá, agora pode ver o que eu escrevi.</p><button id="home-final" class="btn btn-primary">Abrir mensagem →</button></section>`:''}<footer class="footer"><span>Feito especialmente para Alice. <span aria-hidden="true">♥</span> (não se acostume)</span><span>14 anos · Só no navegador</span></footer>`);
    document.querySelector('#hero-start').addEventListener('click',()=>go(allDone()?'final':'rhythm'));
    document.querySelectorAll('.card-play').forEach(b=>b.addEventListener('click',()=>go(b.dataset.game)));
    document.querySelector('#home-final')?.addEventListener('click',()=>go('final'));
  }

  // RITMO: tempos extraídos dos ataques da gravação enviada, já com 2s de introdução instrumental silenciosa.
  // A linha de acerto usa o próprio tempo de reprodução como relógio, inclusive após pausas.

  // LABIRINTO: geração automática de caminhos.
  function generateMaze(size=17) {
    const grid=Array.from({length:size},()=>Array(size).fill(1));
    const dirs=[[0,-2],[2,0],[0,2],[-2,0]];
    const stack=[[1,1]];grid[1][1]=0;
    while(stack.length){
      const [x,y]=stack[stack.length-1];
      const options=dirs.filter(([dx,dy])=>{const xx=x+dx,yy=y+dy;return xx>0&&yy>0&&xx<size-1&&yy<size-1&&grid[yy][xx]===1;});
      if(!options.length){stack.pop();continue;}
      const [dx,dy]=options[Math.floor(Math.random()*options.length)];
      grid[y+dy/2][x+dx/2]=0;grid[y+dy][x+dx]=0;stack.push([x+dx,y+dy]);
    }
    return grid;
  }
  function renderMaze() {
    gameFrame('maze',`<div class="stat-row"><div class="stat"><div class="stat-label">Tempo</div><strong id="maze-time">0:00</strong></div><div class="stat"><div class="stat-label">Passos</div><strong id="maze-steps">0</strong></div></div><div class="maze-layout"><div class="maze-canvas-wrap"><canvas class="maze-canvas" id="maze-canvas" width="560" height="560" role="img" aria-label="Labirinto com paredes, sua posição laranja e saída verde"></canvas></div><aside class="maze-info"><div><h3>Chegue até a saída.</h3><p>Use as setas ou <strong>W A S D</strong> no teclado. No celular, use os botões ou deslize o dedo pelo mapa.</p><div class="maze-legend"><span class="legend-marker">Você</span><span class="legend-marker exit">Saída</span></div><p id="maze-feedback" class="feedback" role="status" aria-live="polite"></p></div><div class="dpad" aria-label="Controles de direção"><button aria-label="Cima" class="up" data-dir="up">↑</button><button aria-label="Esquerda" class="left" data-dir="left">←</button><button aria-label="Baixo" class="down" data-dir="down">↓</button><button aria-label="Direita" class="right" data-dir="right">→</button></div></aside></div><div class="game-actions"><button id="maze-again" class="btn btn-ghost btn-small">Novo labirinto</button><span class="helper">Não tem limite de tempo. Calma, que não é vestibular.</span></div><div id="maze-result"></div>`);
    const canvas=document.querySelector('#maze-canvas'),ctx=canvas.getContext('2d'),size=17;
    let grid=generateMaze(size),x=1,y=1,steps=0,bumps=0,done=false,started=performance.now(),interval=null;
    const end={x:size-2,y:size-2};
    function draw() {
      const s=canvas.width/size;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#1d1b25';ctx.fillRect(0,0,canvas.width,canvas.height);
      for(let row=0;row<size;row++)for(let col=0;col<size;col++){
        const xx=col*s,yy=row*s;
        if(grid[row][col]){ctx.fillStyle='#615575';ctx.fillRect(xx+.8,yy+.8,s-1.6,s-1.6);ctx.fillStyle='#796b90';ctx.fillRect(xx+.8,yy+.8,s-2.2,3);}else{ctx.fillStyle='#282732';ctx.fillRect(xx,yy,s+.2,s+.2);}
      }
      ctx.fillStyle='#a0d6bc';ctx.fillRect(end.x*s+4,end.y*s+4,s-8,s-8);
      ctx.strokeStyle='#d8ffea';ctx.strokeRect(end.x*s+7,end.y*s+7,s-14,s-14);
      ctx.beginPath();ctx.arc((x+.5)*s,(y+.5)*s,s*.31,0,Math.PI*2);ctx.fillStyle='#f37b69';ctx.shadowColor='#f37b69';ctx.shadowBlur=17;ctx.fill();ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc((x+.5)*s,(y+.5)*s,s*.1,0,Math.PI*2);ctx.fillStyle='#fff8ee';ctx.fill();

    const feedback=document.querySelector('#maze-feedback');

      x+=dx;y+=dy;steps++;document.querySelector('#maze-steps').textContent=steps;feedback.textContent='';draw();
      if(x===end.x&&y===end.y){done=true;markComplete('maze');clearInterval(interval);
        const elapsed=Math.floor((performance.now()-started)/1000);
        document.querySelector('#maze-result').innerHTML=completionBlock('Você saiu!',`Foram ${steps} passos e ${Math.floor(elapsed/60)}m ${elapsed%60}s. O GPS está orgulhoso. Acho.`,'maze');attachCompletion('home','maze');
      }
    }
    const dirMap={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
    const onKey=e=>{if(currentView!=='maze'||e.repeat||e.target.matches('input, textarea'))return;const v=dirMap[e.key];if(v){e.preventDefault();move(...v);}};
    document.addEventListener('keydown',onKey);
    const dirButtons={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
    document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(...dirButtons[b.dataset.dir])));
    document.querySelector('#maze-again').addEventListener('click',()=>go('maze'));
    let touch=null;
    canvas.addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};},{passive:true});

      document.querySelector('#maze-time').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
    },250);
    cleanup=()=>{clearInterval(interval);document.removeEventListener('keydown',onKey);};
    draw();
  }

  // Gaveta: peças físicas reais. A validação segue as conexões, não uma senha de rotações.
  // 0 = norte, 1 = leste, 2 = sul, 3 = oeste.
  function circuitPorts(tile) {
    const base=tile.kind==='straight'?[0,2]:[0,1];
    return base.map(d=>(d+tile.rot)%4);
  }
  function circuitPath(tiles) {
    const visited=new Set();let at=0,enter=3;
    for(let step=0;step<10;step++){
      if(visited.has(at))return null;
      visited.add(at);
      const ports=circuitPorts(tiles[at]);
      if(!ports.includes(enter))return null;
      const out=ports.find(d=>d!==enter);
      const row=Math.floor(at/3),col=at%3;
      const nx=col+[0,1,0,-1][out],ny=row+[-1,0,1,0][out];
      if(nx<0||nx>2||ny<0||ny>2){
        return at===8&&out===1&&visited.size===9 ? visited : null;
      }
      const next=ny*3+nx,from=(out+2)%4;
      if(!circuitPorts(tiles[next]).includes(from))return null;
      at=next;enter=from;
    }
    return null;
  }
  function circuitPieceSvg(piece){
    const path=piece.kind==='straight'?'M50 3 V97':'M50 3 V50 H97';
    return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g transform="rotate(${piece.rot*90} 50 50)"><path class="conduit-base" d="${path}"/><path class="conduit" d="${path}"/><circle class="conduit-center" cx="50" cy="50" r="11"/></g></svg>`;
  }
  function solveCircuit(){
    const s=escapeState;
    showDialog('Gaveta',`<p>Monte uma única conexão da <strong>entrada</strong> à <strong>saída</strong>, passando pelas nove peças.</p>
      <p class="helper">Arraste peças para trocar de lugar, ou toque em duas. Use ↻ para girar cada uma.</p>
      <div id="circuit-board" class="circuit-board" role="group" aria-label="Quebra-cabeça com nove peças de circuito móveis e giratórias"></div>
      <p id="circuit-feedback" class="circuit-progress" role="status" aria-live="polite">Circuito desligado</p>`,layer=>{
      const board=layer.querySelector('#circuit-board'),feedback=layer.querySelector('#circuit-feedback');
      let selected=null,drag=null;
      function finishIfConnected(){
        if(!circuitPath(s.tiles))return false;
        s.circuit=true;updateInventory();
        showDialog('Gaveta aberta',`<p>O circuito fechou e liberou a gaveta.</p><p>Você encontrou uma <strong>bateria</strong>.</p>`);
        return true;
      }
      function swapSlots(a,b){
        if(a===b)return;
        [s.tiles[a],s.tiles[b]]=[s.tiles[b],s.tiles[a]];
        selected=null;
        if(!finishIfConnected()){feedback.textContent='Circuito desligado';paint();}
      }
      function selectSlot(index){
        if(selected===null){selected=index;feedback.textContent='Peça selecionada';paint();return;}
        if(selected===index){selected=null;feedback.textContent='Circuito desligado';paint();return;}
        swapSlots(selected,index);
      }
      function paint(){
        board.innerHTML=s.tiles.map((piece,i)=>`<div class="circuit-slot ${selected===i?'is-selected':''}" data-slot="${i}">
          ${i===0?'<span class="circuit-pin start">ENTRADA</span>':''}
          ${i===8?'<span class="circuit-pin end">SAÍDA</span>':''}
          <button class="circuit-piece" type="button" data-piece="${i}" aria-label="Selecionar e mover peça ${i+1}">${circuitPieceSvg(piece)}</button>
          <button class="circuit-rotate" type="button" data-rotate="${i}" aria-label="Girar peça ${i+1} em 90 graus">↻</button></div>`).join('');
      }
      board.addEventListener('click',e=>{
        const rot=e.target.closest('[data-rotate]');
        if(rot){const i=Number(rot.dataset.rotate);s.tiles[i].rot=(s.tiles[i].rot+1)%4;
          if(!finishIfConnected()){feedback.textContent='Circuito desligado';paint();}return;}
      });
      // Teclado: Enter/Espaço seleciona; o click sintético de toque não troca duas vezes.
      board.addEventListener('keydown',e=>{
        const piece=e.target.closest('[data-piece]');
        if(piece&&(e.key==='Enter'||e.key===' ')){
          e.preventDefault();selectSlot(Number(piece.dataset.piece));
        }
      });
      board.addEventListener('pointerdown',e=>{
        const piece=e.target.closest('[data-piece]');
        if(!piece||e.button!==0)return;
        const index=Number(piece.dataset.piece);
        drag={pointer:e.pointerId,index,x:e.clientX,y:e.clientY,moved:false,ghost:null};
        piece.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      board.addEventListener('pointermove',e=>{
        if(!drag||e.pointerId!==drag.pointer)return;
        if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){
          drag.moved=true;
          if(!drag.ghost){
            drag.ghost=document.createElement('div');drag.ghost.className='circuit-piece-ghost';
            drag.ghost.innerHTML=circuitPieceSvg(s.tiles[drag.index]);
            const r=board.querySelector(`[data-piece="${drag.index}"]`).getBoundingClientRect();
            drag.ghost.style.width=`${r.width}px`;drag.ghost.style.height=`${r.height}px`;
            document.body.appendChild(drag.ghost);
          }
          drag.ghost.style.left=`${e.clientX}px`;drag.ghost.style.top=`${e.clientY}px`;
          board.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
          document.elementFromPoint(e.clientX,e.clientY)?.closest('.circuit-slot')?.classList.add('drop-target');
        }
      });
      function endDrag(e){
        if(!drag||e.pointerId!==drag.pointer)return;
        const {index,moved,ghost}=drag;drag=null;
        ghost?.remove();board.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
        if(e.type==='pointercancel')return;
        if(!moved){selectSlot(index);return;}
        const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');
        if(target&&board.contains(target))swapSlots(index,Number(target.dataset.slot));
      }
      board.addEventListener('pointerup',endDrag);
      board.addEventListener('pointercancel',endDrag);
      paint();
    });
  }
  function solveWires(){
    const s=escapeState;
    if(!s.circuit){showDialog('Quadro',`<p>O quadro está solto. Atrás dele existe um painel de fios, mas falta uma bateria.</p>`);return;}
    showDialog('Painel atrás do quadro',`<p>Conecte as cinco cores. Você pode começar por qualquer lado.</p><div class="wire-board" id="wire-board"><svg class="wire-lines" id="wire-lines" aria-hidden="true"></svg><div id="wire-left" class="wire-column"></div><div class="wire-bridges" id="wire-bridges"></div><div id="wire-right" class="wire-column"></div></div><div class="esc-error" id="wire-feedback" role="status"></div>`,layer=>{
      const colors=[{id:'coral',name:'Coral',hex:'#f37b69'},{id:'violet',name:'Roxo',hex:'#a88cf5'},{id:'mint',name:'Verde',hex:'#a0d6bc'},{id:'gold',name:'Dourado',hex:'#e5c26b'},{id:'blue',name:'Azul',hex:'#6ca8ff'}];
      const nameById=Object.fromEntries(colors.map(c=>[c.id,c]));
      let selected=null;
      const left=layer.querySelector('#wire-left'),right=layer.querySelector('#wire-right'),feedback=layer.querySelector('#wire-feedback'),bridges=layer.querySelector('#wire-bridges');
      function drawWires(){
        const box=layer.querySelector('#wire-board');const svg=layer.querySelector('#wire-lines');
        if(!box||!box.isConnected)return;
        const origin=box.getBoundingClientRect(),width=origin.width,height=origin.height;
        svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
        const paths=s.connected.map(id=>{
          const from=left.querySelector(`[data-port="${id}"]`),to=right.querySelector(`[data-port="${id}"]`);
          if(!from||!to)return '';
          const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
          const x1=a.right-origin.left-5,y1=a.top-origin.top+a.height/2;
          const x2=b.left-origin.left+5,y2=b.top-origin.top+b.height/2;
          return `<path class="wire-path" d="M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}" stroke="${nameById[id].hex}" />`;
        }).join('');
        svg.innerHTML=paths;
      }
      function selectPort(side,id){
        if(s.connected.includes(id))return;
        if(!selected){selected={side,id};feedback.textContent=`${nameById[id].name} selecionado. Toque na mesma cor do outro lado.`;paint();return;}
        if(selected.side===side){selected={side,id};feedback.textContent=`${nameById[id].name} selecionado. Toque no outro lado.`;paint();return;}
        if(selected.id!==id){feedback.textContent='As duas pontas são de cores diferentes.';layer.querySelector('#wire-board').classList.remove('wrong-connection');void layer.querySelector('#wire-board').offsetWidth;layer.querySelector('#wire-board').classList.add('wrong-connection');return;}
        s.connected.push(id);selected=null;feedback.textContent='Conexão feita.';
        if(s.connected.length===5){s.powered=true;updateInventory();showDialog('Energia restaurada',`<p>Os cinco fios estão ligados. A luminária da mesa voltou a funcionar.</p><p>Por algum milagre, nada explodiu.</p>`);return;}
        paint();
      }
      function paint(){
        left.innerHTML=colors.map(c=>`<button class="wire-port ${selected?.side==='left'&&selected.id===c.id?'wire-selected':''} ${s.connected.includes(c.id)?'wire-connected':''}" data-port="${c.id}" style="--port:${c.hex}" ${s.connected.includes(c.id)?'disabled':''} aria-label="Selecionar ponta ${c.name} da esquerda"><i></i>${c.name}</button>`).join('');
        right.innerHTML=[colors[3],colors[0],colors[4],colors[1],colors[2]].map(c=>`<button class="wire-port ${selected?.side==='right'&&selected.id===c.id?'wire-selected':''} ${s.connected.includes(c.id)?'wire-connected':''}" data-port="${c.id}" style="--port:${c.hex}" ${s.connected.includes(c.id)?'disabled':''} aria-label="Selecionar ponta ${c.name} da direita"><i></i>${c.name}</button>`).join('');
        bridges.textContent=`${s.connected.length} / 5 fios`;
        left.querySelectorAll('[data-port]').forEach(b=>b.addEventListener('click',()=>selectPort('left',b.dataset.port)));
        right.querySelectorAll('[data-port]').forEach(b=>b.addEventListener('click',()=>selectPort('right',b.dataset.port)));
        drawWires();
      }
      paint();
    });
  }
  function aimLamp(){
    const s=escapeState;
    if(!s.powered){showDialog('Luminária da mesa',`<p>A luminária da mesa não liga. Parece estar sem energia.</p>`);return;}
    if(s.beam){showDialog('Luminária da mesa',`<p>O feixe da luminária da mesa já está apontado para a estante. Há símbolos brilhando nas prateleiras.</p>`);return;}
    showDialog('Luminária da mesa',`<p>Gire a luminária da mesa até a luz alcançar a estante, à direita da mesa.</p><div class="lamp-aim"><div class="lamp-art"><span id="lamp-ray" class="lamp-ray"></span><span class="lamp-base">◉</span><span class="lamp-target">▥<small>Estante</small></span></div><p id="lamp-direction" class="helper">Direção: para cima</p></div><div class="result-actions"><button id="lamp-rotate" class="btn btn-secondary">Girar 90° ↻</button><button id="lamp-shine" class="btn btn-primary">Acender</button></div><div id="lamp-feedback" class="esc-error" role="status"></div>`,layer=>{
      const ray=layer.querySelector('#lamp-ray'),direction=layer.querySelector('#lamp-direction'),feedback=layer.querySelector('#lamp-feedback');
      const directions=['para cima','para baixo','para a direita','para a esquerda'];
      function paint(){ray.style.transform=`rotate(${[270,90,0,180][s.angle]}deg)`;direction.textContent=`Direção: ${directions[s.angle]}`;}
      layer.querySelector('#lamp-rotate').addEventListener('click',()=>{s.angle=(s.angle+1)%4;paint();feedback.textContent='';});
      layer.querySelector('#lamp-shine').addEventListener('click',()=>{
        if(s.angle!==2){feedback.textContent='A luz não atingiu a estante. Ajuste a direção.';return;}
        s.beam=true;updateInventory();showDialog('Estante iluminada',`<p>A luz revelou seis símbolos escondidos na madeira da estante.</p><div class="symbol-order">★　●　◆　▲　☾　✦</div><p>Agora o bilhete da mesa faz sentido.</p>`);
      });paint();
    });
  }
  function solveBooks(){
    const s=escapeState;
    if(!s.beam){showDialog('Estante',`<p>Há seis livros com símbolos nas capas, mas a fechadura parece reagir à luz.</p>`);return;}
    if(s.key){showDialog('Estante',`<p>O compartimento já abriu. Você pegou a chave que estava escondida atrás dos livros.</p>`);return;}
    showDialog('Estante',`<p>Os livros estão fora de ordem. Toque em um e depois em outro para trocar de lugar.</p><div class="books-target"><small>Inscrição iluminada:</small><strong>★　●　◆　▲　☾　✦</strong></div><div class="books-board" id="books-board" role="group" aria-label="Organizar livros por símbolos"></div><p id="books-feedback" class="esc-error" role="status"></p>`,layer=>{
      const board=layer.querySelector('#books-board'),feedback=layer.querySelector('#books-feedback');
      function paint(){
        board.innerHTML=s.books.map((symbol,i)=>`<button class="symbol-book ${s.selectedBook===i?'book-selected':''}" data-book="${i}" aria-label="Livro com símbolo ${symbol}, posição ${i+1}">${symbol}</button>`).join('');
        board.querySelectorAll('[data-book]').forEach(b=>b.addEventListener('click',()=>{
          const i=Number(b.dataset.book);
          if(s.selectedBook===null){s.selectedBook=i;feedback.textContent='Agora toque no livro que você quer trocar de lugar.';paint();return;}
          [s.books[s.selectedBook],s.books[i]]=[s.books[i],s.books[s.selectedBook]];s.selectedBook=null;paint();
          if(s.books.join('')==='★●◆▲☾✦'){
            s.key=true;updateInventory();showDialog('Compartimento aberto',`<p>Os livros destravaram o fundo da estante. Atrás deles havia uma <strong>chave</strong>.</p><p>Bom. Só falta a parte em que você vai embora deste quarto.</p>`);
          }
        }));
      }paint();
    });
  }
  function examine(object){
    const s=escapeState;if(!s||s.solved)return;
    switch(object){
      case 'memo':showDialog('Bilhete',`<p>Um papel com uma anotação:</p><div class="symbol-order">★　●　◆　▲　☾　✦</div><p>Há marcas de lápis nas bordas do papel, como se alguém tivesse testado várias ordens antes.</p>`);break;
      case 'drawer':if(s.circuit)showDialog('Gaveta',`<p>A gaveta já está aberta. A bateria estava aqui.</p>`);else solveCircuit();break;
      case 'poster':if(s.powered)showDialog('Quadro',`<p>O painel já está conectado. A luz da mesa funciona.</p>`);else solveWires();break;
      case 'lamp':aimLamp();break;
      case 'cabinet':solveBooks();break;
      case 'door':
        if(!s.key){showDialog('Porta',`<p>Está trancada com uma fechadura comum. Finalmente alguma coisa que faz sentido.</p>`);break;}
        s.solved=true;markComplete('escape');
        document.querySelector('#esc-done').classList.remove('hidden');
        document.querySelectorAll('.hotspot').forEach(b=>{b.disabled=true;b.style.opacity='.45';});
        document.querySelector('#esc-result').innerHTML=completionBlock('Porta aberta.','Boa, pirralha. Você conseguiu sair. Sem chutar nenhuma fechadura.','escape');attachCompletion('home','escape');
        break;
    }
  }

  function renderFinal() {
    if(!allDone()){go('home');return;}
    const particles=Array.from({length:29},(_,i)=>`<span class="confetti" aria-hidden="true" style="--x:${(i*73)%100}%;--color:${['#f37b69','#a88cf5','#a0d6bc','#e8d9c2'][i%4]};--rot:${i*37}deg;--delay:${(i%9)*.12}s;--duration:${3.3+(i%4)*.45}s"></span>`).join('');
    shell(`<section class="final-wrap">${particles}<span class="eyebrow">Os três jogos concluídos</span><h1 class="final-title">Feliz aniversário, Alice.</h1><div class="final-message"><p>14 anos. Parabéns por sobreviver a mais um ano sendo você. Não deve ser fácil para as pessoas ao seu redor, mas seguimos firmes.</p><p>Brincadeiras à parte, espero que esse novo ano seja cheio de coisas boas, de momentos divertidos e de tudo aquilo que te faça feliz. Você merece.</p><p>Eu poderia escrever um texto enorme e sentimental, mas a gente sabe que eu ia te zoar no meio de qualquer jeito.</p><p>Então é isso: aproveita muito seu dia. E pode contar comigo, mesmo quando estiver sendo insuportável.</p><p class="final-sign">Feliz 14 anos, pirralha.<br>— Seu irmão</p></div><div class="final-tools"><button class="btn btn-primary" id="final-home">Voltar aos jogos</button><button class="btn btn-secondary" id="final-copy">Copiar mensagem</button><button class="btn btn-ghost" id="final-reset">Recomeçar tudo</button></div><p id="copy-feedback" class="helper" aria-live="polite"></p></section>`);
    document.querySelector('#final-home').addEventListener('click',()=>go('home'));
    document.querySelector('#final-copy').addEventListener('click',async()=>{
      const text=`Feliz aniversário, Alice!\n\n14 anos. Parabéns por sobreviver a mais um ano sendo você. Não deve ser fácil para as pessoas ao seu redor, mas seguimos firmes.\n\nBrincadeiras à parte, espero que esse novo ano seja cheio de coisas boas, de momentos divertidos e de tudo aquilo que te faça feliz. Você merece.\n\nEu poderia escrever um texto enorme e sentimental, mas a gente sabe que eu ia te zoar no meio de qualquer jeito.\n\nEntão é isso: aproveita muito seu dia. E pode contar comigo, mesmo quando estiver sendo insuportável.\n\nFeliz 14 anos, pirralha.\n— Seu irmão`;
      try {await navigator.clipboard.writeText(text);document.querySelector('#copy-feedback').textContent='Mensagem copiada.';} catch {document.querySelector('#copy-feedback').textContent='Não foi possível copiar automaticamente neste navegador.';}
    });
    document.querySelector('#final-reset').addEventListener('click',()=>{
      showDialog('Recomeçar os jogos?',`<p>Isso apaga o progresso salvo neste aparelho e volta a bloquear a mensagem final.</p><div class="result-actions"><button class="btn btn-primary" id="confirm-reset">Sim, recomeçar</button><button class="btn btn-secondary" id="cancel-reset">Cancelar</button></div>`,layer=>{
        layer.querySelector('#confirm-reset').addEventListener('click',()=>{completed={rhythm:false,maze:false,escape:false};saveProgress();closeDialog();go('home');});
        layer.querySelector('#cancel-reset').addEventListener('click',closeDialog);
      });
    });
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeDialog)closeDialog();});
  go('home');
})();

</script>
